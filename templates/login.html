{% extends "base.html" %}{% block title %}Sign in · GPGC Nowshera{% endblock %}
{% block content %}
<div class="login-card">
  <div class="brand-mark">G</div>
  <p class="eyebrow">COLLEGE MANAGEMENT CLOUD</p>
  <h1>Welcome back</h1><p class="muted">Sign in to your GPGC Nowshera workspace.</p>
  <form method="post" class="mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Email address</label><input class="form-control form-control-lg mb-3" type="email" name="email" required autocomplete="username" placeholder="you@college.edu">
    <label class="form-label">Password</label><input class="form-control form-control-lg mb-4" type="password" name="password" required autocomplete="current-password" placeholder="Your password">
    <button class="btn btn-primary btn-lg w-100">Sign in securely</button>
  </form>
  <div class="small muted mt-4">Change the initial password before real use.</div>
</div>
{% endblock %}
