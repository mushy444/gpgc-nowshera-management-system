services:
  - type: web
    name: gpgc-nowshera-saas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: BOOTSTRAP_DB
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gpgc-nowshera-db
          property: connectionString

databases:
  - name: gpgc-nowshera-db
    databaseName: gpgc_saas
    user: gpgc_user
